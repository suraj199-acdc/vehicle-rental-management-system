<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin dashboard | VROOM</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="js/storage.js" defer></script>
    <script src="js/admin.js" defer></script>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">VROOM<span>.</span></a>

    <nav>
        <a href="index.html">Website</a>
        <a href="my-bookings.html">My bookings</a>
        <button id="logoutButton" class="btn btn-small">Logout</button>
    </nav>

</header>

<main class="page-wrap">

    <div class="page-title">
        <span class="eyebrow">MANAGEMENT</span>
        <h1>Admin dashboard</h1>
        <p class="muted">Manage vehicles, customers and bookings.</p>
    </div>

    <div id="adminMessage"></div>

    <div class="stats-grid">

        <div class="stat-card">
            <span>Total vehicles</span>
            <strong id="totalVehicles">0</strong>
        </div>

        <div class="stat-card">
            <span>Total bookings</span>
            <strong id="totalBookings">0</strong>
        </div>

        <div class="stat-card">
            <span>Pending requests</span>
            <strong id="pendingBookings">0</strong>
        </div>

        <div class="stat-card">
            <span>Approved bookings</span>
            <strong id="approvedBookings">0</strong>
        </div>

    </div>

    <section class="panel">

        <h2>Add new vehicle</h2>

        <form id="vehicleForm">

            <div class="form-grid">

                <div class="field">
                    <label>Vehicle name</label>
                    <input id="name" required>
                </div>

                <div class="field">
                    <label>Category</label>
                    <select id="category">
                        <option>Car</option>
                        <option>Bike</option>
                        <option>SUV</option>
                        <option>Van</option>
                    </select>
                </div>

                <div class="field">
                    <label>Brand</label>
                    <input id="brand" required>
                </div>

                <div class="field">
                    <label>Model</label>
                    <input id="model">
                </div>

                <div class="field">
                    <label>Price per day (Rs.)</label>
                    <input type="number" id="price" min="1" required>
                </div>

                <div class="field">
                    <label>Transmission</label>
                    <select id="transmission">
                        <option>Manual</option>
                        <option>Automatic</option>
                        <option>Electric</option>
                    </select>
                </div>

                <div class="field">
                    <label>Seats</label>
                    <input type="number" id="seats" min="1" value="5">
                </div>

                <div class="field">
                    <label>Fuel type</label>
                    <select id="fuel">
                        <option>Petrol</option>
                        <option>Diesel</option>
                        <option>Electric</option>
                        <option>Hybrid</option>
                    </select>
                </div>

                <div class="field field-full">
                    <label>Image URL</label>
                    <input type="url" id="image">
                </div>

                <div class="field field-full">
                    <label>Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

            </div>

            <button class="btn" type="submit">Add vehicle</button>

        </form>

    </section>

    <section class="panel">
        <h2>Vehicle inventory</h2>
        <div id="vehicleTable" class="table-wrap"></div>
    </section>

    <section class="panel">
        <h2>Booking requests</h2>
        <div id="bookingTable" class="table-wrap"></div>
    </section>

    <section class="panel">
        <h2>Registered customers</h2>
        <div id="customerTable" class="table-wrap"></div>
    </section>

</main>

</body>
</html>
